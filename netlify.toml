# Netlify configuration.
#
# The site itself still has no build step — `publish = "."` serves the folder
# exactly as it sits on disk. The only addition is the three payment
# functions, which Netlify installs and runs for us.

[build]
  publish  = "."
  command  = ""
  functions = "netlify/functions"

# Friendlier URLs: /api/create-order instead of /.netlify/functions/create-order
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# The originals and working documents are in the repo for safekeeping,
# but there is no reason to publish 69MB of them to the web.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    cache-control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    cache-control = "public, max-age=604800"
