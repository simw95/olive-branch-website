# Netlify configuration.
#
# The site still has no build step in the sense that matters: nothing is
# compiled or bundled, and index.html opens straight from file:// with the
# cart working. `tools/publish.sh` only copies the publishable files into
# _site/, because the repository also holds 185MB of photographic masters and
# the internal notes, and Netlify uploads a publish folder whole with no
# exclude list. See the header of that script.

[build]
  publish   = "_site"
  command   = "bash tools/publish.sh"
  functions = "netlify/functions"

# Friendlier URLs: /api/create-order instead of /.netlify/functions/create-order
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# The originals and working documents stay in the repository for safekeeping;
# tools/publish.sh is what keeps them off the web.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# CSS and JS keep the same filenames from one deploy to the next, and data.js
# carries prices and the announcement bar. A week-long max-age kept returning
# visitors on the old copy for up to seven days after a deploy. Revalidating
# costs one conditional request per file, answered with a 304 when unchanged.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
